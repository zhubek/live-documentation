services:
  studio:
    build: .
    container_name: live-documentation
    restart: unless-stopped
    ports:
      - "8085:3000"
    env_file: .env
    volumes:
      - studio-data:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  studio-data:
